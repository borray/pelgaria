name: Verify SONAR

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build client
        working-directory: sonar/client
        run: |
          npm ci
          npm run build

      - name: Build server
        working-directory: sonar/server
        run: |
          npm ci
          npm run build

      - name: Generate PDF with bundled Chromium
        working-directory: sonar/server
        env:
          SONAR_BUNDLED_CHROMIUM: '1'
        run: |
          node - <<'NODE'
          const { htmlToPdf, closePdfBrowser } = require('./dist/services/pdf')
          const { pageShell, guillocheRosette, escapeHtml } = require('./dist/services/templates')
          const rows = Array.from({ length: 45 }, (_, index) =>
            `<tr><td>${index + 1}</td><td>${escapeHtml(`Record <${index}> & stress check`)}</td></tr>`
          ).join('')
          const makeDocument = (index) => pageShell({
            seed: `ci-${index}`,
            kind: 'ci-stress',
            header: `<h1>SONAR PDF check ${index}</h1>`,
            body: `<table>${rows}</table>`,
            footer: `<div>Control document ${index}</div>`,
            watermark: `<div>${guillocheRosette(`ci-${index}`, 500)}</div>`,
            styles: 'td{border-bottom:1px solid #ccc;padding:5px;font-size:11px}',
          })

          Promise.all([1, 2, 3].map(async (index) => {
            const pdf = await htmlToPdf(makeDocument(index))
            if (pdf.subarray(0, 4).toString() !== '%PDF' || pdf.length < 5000) {
              throw new Error(`Invalid PDF ${index}`)
            }
            return pdf.length
          }))
            .then(async (sizes) => {
              console.log(`PDF stress check passed: ${sizes.join(', ')} bytes`)
              await closePdfBrowser()
            })
            .catch(async (error) => {
              console.error(error)
              await closePdfBrowser()
              process.exit(1)
            })
          NODE

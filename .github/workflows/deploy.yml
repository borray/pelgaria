name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        with:
          host: 194.67.119.74
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: AUTH_SECRET,ADMIN_PASSWORD,ADMIN_EMAIL
          script: |
            cd /var/www/pelgaria/pelgaria
            git pull origin main

            # Всегда перезаписываем .env.local свежими значениями из секретов
            printf "AUTH_SECRET=%s\nADMIN_PASSWORD=%s\nADMIN_EMAIL=%s\n" \
              "$AUTH_SECRET" "$ADMIN_PASSWORD" "$ADMIN_EMAIL" > .env.local

            NODE_OPTIONS="--max-old-space-size=1024" npm run build
            /usr/bin/pm2 restart most --update-env
            echo "Deployed successfully!"

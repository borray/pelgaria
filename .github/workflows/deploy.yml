name: Deploy Pelgaria Foundation

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build foundation server
        working-directory: sonar/server
        run: |
          npm ci
          npm run build

      - name: Build public foundation
        working-directory: sonar/client
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload foundation
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p /home/sonar/app/dist /home/sonar/app/public"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" sonar/server/dist/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/sonar/app/dist/
          rsync -az -e "ssh -i ~/.ssh/deploy_key" sonar/server/package.json sonar/server/package-lock.json ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/sonar/app/
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" sonar/client/dist/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/sonar/app/public/

      - name: Restart foundation
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            cd /home/sonar/app
            cat > .env << 'ENVEOF'
            CLIENT_URL=https://pg-bridge.ru
            PORT=3001
            ENVEOF
            npm ci --omit=dev
            if pm2 describe sonar > /dev/null 2>&1; then
              pm2 restart sonar --update-env
            else
              pm2 start dist/index.js --name sonar --env production
            fi
            pm2 save
          ENDSSH

      - name: Verify foundation API
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error https://pg-bridge.ru/api/health | grep -q '"phase":"foundation"'; then
              echo "Pelgaria foundation is online"
              exit 0
            fi
            sleep 5
          done
          exit 1

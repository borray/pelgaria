name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        with:
          host: 194.67.119.74
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: AUTH_SECRET,ADMIN_PASSWORD,ADMIN_EMAIL
          script: |
            cd /var/www/pelgaria/pelgaria
            git pull origin main

            # Перезаписываем .env.local и экспортируем в текущую сессию
            cat > .env.local << ENVEOF
            AUTH_SECRET=$AUTH_SECRET
            ADMIN_PASSWORD=$ADMIN_PASSWORD
            ADMIN_EMAIL=$ADMIN_EMAIL
            ENVEOF

            export AUTH_SECRET="$AUTH_SECRET"
            export ADMIN_PASSWORD="$ADMIN_PASSWORD"
            export ADMIN_EMAIL="$ADMIN_EMAIL"

            echo "=== .env.local contents ==="
            cat .env.local

            NODE_OPTIONS="--max-old-space-size=1024" npm run build

            /usr/bin/pm2 restart most --update-env
            sleep 5

            echo "=== PM2 status ==="
            /usr/bin/pm2 status

            echo "=== PM2 logs ==="
            /usr/bin/pm2 logs most --lines 50 --nostream || true

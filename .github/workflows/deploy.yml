name: Deploy Pelgaria SONAR

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build SONAR server
        working-directory: sonar/server
        run: |
          npm ci
          npm run build

      - name: Build public site and SONAR
        working-directory: sonar/client
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload SONAR
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p /home/sonar/app/dist /home/sonar/app/public"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" sonar/server/dist/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/sonar/app/dist/
          rsync -az -e "ssh -i ~/.ssh/deploy_key" sonar/server/package.json sonar/server/package-lock.json ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/sonar/app/
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" sonar/server/prisma/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/sonar/app/prisma/
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" sonar/client/dist/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/sonar/app/public/

      - name: Restart SONAR
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            cd /home/sonar/app
            printf '%s\n' \
              'NODE_ENV=production' \
              'CLIENT_URL=https://pg-bridge.ru' \
              'PORT=3001' \
              'DATABASE_URL=${{ secrets.DATABASE_URL }}' \
              'SONAR_INITIAL_LOGIN=${{ secrets.SONAR_INITIAL_LOGIN }}' \
              'SONAR_INITIAL_PASSWORD=${{ secrets.SONAR_INITIAL_PASSWORD }}' > .env
            npm ci
            npx prisma generate --schema prisma/sonar.prisma
            if pm2 describe sonar > /dev/null 2>&1; then
              pm2 restart sonar --update-env
            else
              pm2 start dist/index.js --name sonar --env production
            fi
            pm2 save
          ENDSSH

      - name: Verify SONAR API
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error https://pg-bridge.ru/api/health | grep -q '"phase":"sonar-alpha"'; then
              echo "Pelgaria SONAR is online"
              exit 0
            fi
            sleep 5
          done
          exit 1
